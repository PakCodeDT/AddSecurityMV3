<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AddSecurity</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 16px;
      border-bottom: 1px solid #1e2535;
    }
    .logo-area {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .logo-area img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: block;
    }
    .status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #0f1117;
      background: #48bb78;
      transition: background 0.2s;
    }
    .status-dot.off {
      background: #718096;
    }
    .status-dot.attack {
      background: #fc8181;
    }
    .header-text {
      flex: 1;
      min-width: 0;
    }
    .site-name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 155px;
    }
    .site-status {
      font-size: 11px;
      color: #68d391;
      margin-top: 2px;
    }
    .site-status.off {
      color: #fc8181;
    }
    .site-status.attack {
      color: #f6ad55;
    }
    .mode-selector {
      padding: 12px 16px;
      border-bottom: 1px solid #1e2535;
    }
    .mode-selector select {
      width: 100%;
      padding: 8px 12px;
      background: #1a1f2e;
      color: #e2e8f0;
      border: 1.5px solid #2d3748;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    .mode-selector select:hover {
      border-color: #4a5568;
    }
    .mode-selector select:focus {
      border-color: #68d391;
    }
    .mode-selector select option {
      background: #1a1f2e;
      color: #e2e8f0;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 11px 8px;
      background: #1a1f2e;
      border: 1.5px solid #2d3748;
      border-radius: 10px;
      cursor: pointer;
      color: #a0aec0;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
      font-family: inherit;
    }
    .action-btn:hover {
      background: #1e2744;
      border-color: #4a5568;
      color: #e2e8f0;
    }
    .action-btn:active { transform: scale(0.96); }
    .footer {
      padding: 8px 14px 10px;
      border-top: 1px solid #1e2535;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-brand {
      font-size: 10px;
      color: #2d3748;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .footer-ver {
      font-size: 10px;
      color: #2d3748;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-area">
      <img id="mode-icon" src="a.png" alt="durum">
      <div class="status-dot" id="status-dot"></div>
    </div>

    <div class="header-text">
      <div class="site-name" id="site-name">Yükleniyor...</div>
      <div class="site-status" id="site-status">Aktif</div>
    </div>
  </div>

  <div class="mode-selector">
    <select id="mode-select">
      <option value="normal">🛡️ Normal</option>
      <option value="off">⛔ Kapalı</option>
    </select>
  </div>

  <div class="buttons">
    <button class="action-btn" id="btn-settings">
      <span class="btn-icon">⚙</span>
      <span>Filtreler</span>
    </button>
    <button class="action-btn" id="btn-about">
      <span class="btn-icon">ⓘ</span>
      <span>Hakkında</span>
    </button>
  </div>

  <div class="footer">
    <span class="footer-brand">PakCodeDT - AddSecurity</span>
    <span class="footer-ver" id="footer-ver"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
